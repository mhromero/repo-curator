[project]
name = "repo-curator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "María Romero Huertas", email = "mrhy2003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
repo-curator = "repo_curator:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
